<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Online - DÓNDE ESTÁN LOS MÍOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0D0D0D;
      --yellow: #F5D76E;
      --red: #E8432A;
      --green: #2AE89A;
      --ink: #f4efe0;
      --muted: #b8ad92;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        linear-gradient(rgba(245, 215, 110, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(245, 215, 110, 0.025) 1px, transparent 1px),
        var(--bg);
      background-size: 32px 32px;
      color: var(--ink);
      font-family: "Space Mono", monospace;
      overflow: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      background: linear-gradient(rgba(255,255,255,0.035) 50%, rgba(0,0,0,0.22) 50%);
      background-size: 100% 4px;
      animation: scanlines 8s linear infinite;
    }

    body::after {
      background: radial-gradient(circle at center, transparent 42%, rgba(0,0,0,0.78) 100%);
    }

    @keyframes scanlines {
      from { background-position: 0 0; }
      to { background-position: 0 80px; }
    }

    main {
      width: min(920px, 100%);
      position: relative;
      z-index: 1;
      border: 2px solid var(--yellow);
      background: rgba(17, 17, 17, 0.95);
      box-shadow: 10px 10px 0 var(--red), 0 0 42px rgba(245, 215, 110, 0.18);
      padding: clamp(28px, 6vw, 56px);
      text-align: center;
    }

    .status {
      display: inline-block;
      margin-bottom: 18px;
      padding: 6px 10px;
      border: 1px solid var(--green);
      color: var(--green);
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--yellow);
      font-family: "Bebas Neue", sans-serif;
      font-size: clamp(4rem, 12vw, 8.5rem);
      font-weight: 400;
      line-height: 0.86;
      text-transform: uppercase;
      text-shadow: 0 0 18px rgba(245, 215, 110, 0.35);
    }

    h2 {
      margin: 8px 0 0;
      color: var(--red);
      font-family: "Bebas Neue", sans-serif;
      font-size: clamp(2.2rem, 6vw, 4.2rem);
      font-weight: 400;
      line-height: 0.95;
      text-transform: uppercase;
    }

    p {
      max-width: 660px;
      margin: 24px auto 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .screen {
      min-height: 220px;
      margin-top: 32px;
      border: 2px dashed rgba(245, 215, 110, 0.52);
      display: grid;
      place-items: center;
      background:
        repeating-linear-gradient(0deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 5px),
        linear-gradient(135deg, rgba(42, 232, 154, 0.1), rgba(232, 67, 42, 0.13)),
        #101010;
      color: var(--yellow);
      font-weight: 700;
      text-transform: uppercase;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      margin-top: 30px;
    }

    a {
      display: inline-flex;
      min-height: 50px;
      align-items: center;
      justify-content: center;
      padding: 12px 22px;
      border: 2px solid currentColor;
      color: var(--yellow);
      font-family: "Bebas Neue", sans-serif;
      font-size: 1.75rem;
      line-height: 1;
      text-decoration: none;
      text-transform: uppercase;
      transition: transform 140ms ease, box-shadow 140ms ease, background 140ms ease, color 140ms ease;
    }

    a:hover {
      transform: translate(-2px, -2px);
      background: var(--yellow);
      color: #211900;
      box-shadow: 6px 6px 0 var(--yellow);
    }

    @media (max-width: 640px) {
      body {
        padding: 16px;
        overflow: auto;
      }

      main {
        padding: 28px 18px;
      }

      .actions {
        flex-direction: column;
      }

      a {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <span class="status">Ruta web de demo preparada</span>
    <h1>Demo online</h1>
    <h2>La semana del perro</h2>
    <p>
      Aquí se cargará la build web jugable. Cuando tengamos el export HTML5/Web del juego, este directorio
      será el punto de entrada de la demo en Vercel.
    </p>
    <div class="screen">Placeholder<br>build web del juego</div>
    <div class="actions">
      <a href="../">Volver a la landing</a>
    </div>
  </main>
</body>
</html>
